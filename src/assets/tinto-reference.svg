<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" width="220" height="240">
  <title>Tinto — reference drawing</title>
  <ellipse id="shadow" cx="110" cy="222" rx="44" ry="7" fill="#2A1418" opacity=".12"/>
  <g id="steam" fill="none" stroke="#A8958F" stroke-width="3" stroke-linecap="round" opacity=".7">
    <path id="steam-left" d="M98 30 q-8 -10 0 -20 q8 -10 0 -20"/>
    <path id="steam-right" d="M118 34 q-8 -10 0 -20 q8 -10 0 -20"/>
  </g>
  <g id="bean">
    <g id="body" transform="rotate(-14 110 125)">
      <ellipse cx="110" cy="125" rx="58" ry="74" fill="#4A2C21"/>
      <ellipse id="highlight" cx="94" cy="98" rx="14" ry="26" fill="#6B4232" opacity=".5"/>
      <path id="crease" d="M110 54 C 88 98, 132 150, 110 197" fill="none" stroke="#2E1A13" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g id="nightcap" opacity="0">
      <path d="M62 78 Q100 20 150 70 Z" fill="#D93A25"/>
      <rect x="58" y="70" width="98" height="12" rx="6" fill="#F7F1EC"/>
      <circle cx="152" cy="60" r="9" fill="#F7F1EC"/>
    </g>
    <g id="face">
      <g id="eye-left">
        <circle cx="90" cy="118" r="12" fill="#F7F1EC"/>
        <circle id="pupil-left" cx="90" cy="118" r="6" fill="#160E0F"/>
      </g>
      <g id="eye-right">
        <circle cx="132" cy="118" r="12" fill="#F7F1EC"/>
        <circle id="pupil-right" cx="132" cy="118" r="6" fill="#160E0F"/>
      </g>
      <rect id="lid-left" x="77" y="104" width="26" height="0" fill="#4A2C21"/>
      <rect id="lid-right" x="119" y="104" width="26" height="0" fill="#4A2C21"/>
      <ellipse id="cheek-left" cx="78" cy="140" rx="9" ry="5" fill="#F0513A" opacity=".6"/>
      <ellipse id="cheek-right" cx="144" cy="140" rx="9" ry="5" fill="#F0513A" opacity=".6"/>
      <path id="mouth-smile" d="M100 142 Q111 152 122 142" fill="none" stroke="#F7F1EC" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse id="mouth-surprised" cx="111" cy="146" rx="5" ry="6" fill="#160E0F" opacity="0"/>
    </g>
  </g>
  <text id="question-mark" x="168" y="70" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="34" fill="#D93A25" opacity="0">?</text>
  <g id="sleep-z" font-family="Space Grotesk, sans-serif" font-weight="700" fill="#A8958F" opacity="0">
    <text x="160" y="60" font-size="18">z</text>
    <text x="174" y="42" font-size="14">z</text>
  </g>
  <g id="sparkles" fill="#D93A25" opacity="0">
    <circle cx="40" cy="80" r="4"/>
    <circle cx="182" cy="90" r="5"/>
    <circle cx="56" cy="40" r="3"/>
    <circle cx="170" cy="36" r="4"/>
    <circle cx="30" cy="140" r="3"/>
    <circle cx="192" cy="150" r="3"/>
  </g>
</svg>
